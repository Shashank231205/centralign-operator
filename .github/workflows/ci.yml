name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python 3.12 --frozen
      - name: Lint
        run: uv run poe lint
      - name: Typecheck
        run: uv run poe typecheck
      - name: Unit tests
        run: uv run poe test

  integration:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: operator
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: operator
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U operator" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE__URL: postgresql+asyncpg://operator:ci-only-password@localhost:5432/operator
      REDIS__URL: redis://localhost:6379/0
      API__BOOTSTRAP_API_KEY: ci-only-api-key
      API__CORS_ORIGINS: '["http://localhost:3000"]'
      LLM__PROVIDERS: '["ollama"]'
      LLM__BACKENDS__OLLAMA__BASE_URL: http://localhost:11434/v1
      LLM__BACKENDS__OLLAMA__MODEL: unused-in-ci
      LLM__BACKENDS__OLLAMA__REQUIRES_API_KEY: "false"
      PATHS__COMPANY_CONTEXT_DIR: company_context
      PATHS__EVIDENCE_DIR: var/evidence
      PATHS__WORKSPACE_DIR: var/workspace
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python 3.12 --frozen
      - name: Migrate
        run: uv run poe migrate
      - name: Integration tests
        run: uv run poe test-integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
