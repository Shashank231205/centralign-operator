# Full stack for reviewers: `cp .env.example .env`, fill secrets, then `make up`.
# Values come from .env; only container hostnames are set here.
x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE__URL: postgresql+asyncpg://operator:${OPERATOR_DB_PASSWORD:?set OPERATOR_DB_PASSWORD}@postgres:5432/operator
    REDIS__URL: redis://redis:6379/0
    SANDBOX_PORTAL_URL: http://sandbox-portal:8101
    SANDBOX_ERP_URL: http://sandbox-erp:8102
    LLM__BACKENDS__OLLAMA__BASE_URL: http://host.docker.internal:11434/v1
  extra_hosts: ["host.docker.internal:host-gateway"]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: operator
      POSTGRES_PASSWORD: ${OPERATOR_DB_PASSWORD:?set OPERATOR_DB_PASSWORD}
      POSTGRES_DB: operator
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operator"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    <<: *backend-env
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    <<: *backend-env
    ports: ["8000:8000"]
    volumes: [evidence:/srv/var/evidence]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    <<: *backend-env
    command: ["arq", "app.workers.main.WorkerSettings"]
    volumes: [evidence:/srv/var/evidence, workspace:/srv/var/workspace]
    stop_grace_period: 90s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      replicas: 2

  sandbox-seed:
    build: { context: ., dockerfile: sandbox/Dockerfile }
    env_file: .env
    command: ["python", "-m", "sandbox.seed"]
    volumes: [sandboxdata:/srv/var/sandbox]

  sandbox-portal:
    build: { context: ., dockerfile: sandbox/Dockerfile }
    env_file: .env
    ports: ["8101:8101"]
    volumes: [sandboxdata:/srv/var/sandbox]
    depends_on:
      sandbox-seed: { condition: service_completed_successfully }

  sandbox-erp:
    build: { context: ., dockerfile: sandbox/Dockerfile }
    env_file: .env
    command: ["uvicorn", "sandbox.internal_erp.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8102"]
    ports: ["8102:8102"]
    volumes: [sandboxdata:/srv/var/sandbox]
    depends_on:
      sandbox-seed: { condition: service_completed_successfully }

  frontend:
    build: { context: frontend }
    environment:
      OPERATOR_API_URL: http://api:8000/api/v1
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:?set OPERATOR_API_KEY}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  evidence:
  workspace:
  sandboxdata:
