[project]
name = "operator-sandbox"
version = "0.1.0"
description = "Mock company environment: vendor portal and internal ERP with chaos injection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "fpdf2>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandbox"]
